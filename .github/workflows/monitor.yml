name: Monitor citas DIAN

on:
  schedule:
    # Cada 5 minutos, que es lo mas seguido que permite GitHub. El script
    # decide adentro si consulta o no, y cuantas veces, segun el dia y la
    # hora de Bogota. Ver "RITMO ADAPTATIVO" en monitor_dian.py.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # permite lanzarlo a mano desde la pestana Actions

# Necesario para que el job pueda guardar state.json de vuelta en el repo
permissions:
  contents: write

# Si una corrida se queda colgada, que no se encimen
concurrency:
  group: monitor-dian
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Clonar el repo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install --no-cache-dir -r requirements.txt

      - name: Consultar la DIAN
        env:
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          DIAN_TIPO_PERSONA: "1"    # 1 = Persona Natural
          DIAN_TIPO_ATENCION: "2"   # 2 = Videoatencion
          DIAN_CATEGORIA: "13"      # 13 = Devoluciones
          DIAN_FILTRO: "Bogot"      # solo Bogota (vacio = cualquier ciudad)
          # Una corrida lanzada a mano siempre consulta, sin importar la hora.
          # Las automaticas respetan el ritmo adaptativo del script.
          DIAN_FORZAR: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python monitor_dian.py

      # Guarda el registro interno. NUNCA hace fallar el workflow: para cuando
      # llega aqui, la consulta a la DIAN y el WhatsApp ya ocurrieron. Si dos
      # corridas coinciden, no se fusiona nada (eso metia marcadores de
      # conflicto dentro del archivo): se parte de la ultima version del
      # remoto y se vuelve a poner la nuestra encima, con reintentos.
      - name: Guardar el estado
        if: always()
        run: |
          if [[ ! -f state.json ]]; then
            echo "No hay state.json que guardar."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          MIO="$(mktemp)"
          cp state.json "$MIO"

          for intento in 1 2 3; do
            git fetch -q origin main || true
            git reset -q --hard origin/main
            cp "$MIO" state.json

            if [[ -z "$(git status --porcelain state.json)" ]]; then
              echo "Sin cambios que guardar."
              exit 0
            fi

            git add state.json
            git commit -qm "estado: $(date -u '+%Y-%m-%d %H:%M UTC')"

            if git push -q origin main 2>/dev/null; then
              echo "Estado guardado (intento $intento)."
              exit 0
            fi

            echo "Otra corrida guardo primero. Reintento $intento de 3."
            sleep $((intento * 3))
          done

          echo "AVISO: no pude guardar el registro despues de 3 intentos."
          echo "Esto NO afecta las alertas de WhatsApp, que ya se enviaron."
          exit 0
